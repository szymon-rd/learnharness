<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="dark">
	<title>LearnHarness</title>
	<link rel="stylesheet" href="app.css">
</head>
<body>
	<main id="connect" hidden>
		<h1>LearnHarness</h1>
		<p class="lead">Connect to the LearnHarness phone server running on your computer.</p>
		<form id="form" novalidate>
			<label for="url">Server address</label>
			<input id="url" name="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="http://192.168.1.20:3210" required>
			<label for="code">Access code</label>
			<input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" required>
			<p id="error" class="error" hidden></p>
			<button type="submit">Connect</button>
		</form>
		<p class="hint">On your computer, run <code>npm run phone</code> in the LearnHarness folder. It prints the address and the access code.</p>
	</main>
	<script src="connect.js"></script>
	<script>
		LH.initConnectPage();
	</script>
</body>
</html>
