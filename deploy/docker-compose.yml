# LearnHarness on your own server: the app, Caddy for automatic HTTPS, and
# Lean + Mathlib for code cells.
#   cp .env.example .env    # set LH_HOST
#   docker compose up -d --build
# See docs/deploy-vps.md.
services:
  learnharness:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LH_PUBLIC_URL: https://${LH_HOST:?Set LH_HOST in deploy/.env (see .env.example)}
      LH_LEAN_URL: http://lean:3300
    volumes:
      - learnharness-data:/data
    # Chromium (interactive demos) needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    networks: [default, lean]

  # Lean 4 + Mathlib for code cells (deploy/lean). No internet access (the
  # "lean" network is internal), an unprivileged user, a read-only file
  # system and a memory cap: cells can run arbitrary Lean code.
  lean:
    image: learnharness-lean:${LEAN_TAG:-local}
    build: ./lean
    restart: unless-stopped
    environment:
      LH_PUBLIC_URL: https://${LH_HOST:?Set LH_HOST in deploy/.env (see .env.example)}
      # Language servers at once (each needs about 1.5 GB with Mathlib).
      LEAN_MAX_SESSIONS: ${LEAN_MAX_SESSIONS:-1}
    networks: [lean]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    mem_limit: ${LEAN_MEM_LIMIT:-3g}
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - learnharness
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LH_HOST: ${LH_HOST:?Set LH_HOST in deploy/.env (see .env.example)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [default, lean]

networks:
  default:
  lean:
    internal: true

volumes:
  learnharness-data:
  caddy-data:
  caddy-config:
