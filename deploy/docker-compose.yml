# LearnHarness on your own server: the app, Caddy for automatic HTTPS, and
# Lean + Mathlib, the TLA+ tools and C++ for code cells.
#   cp .env.example .env    # set LH_HOST
#   docker compose up -d --build
# See docs/deploy-vps.md.
services:
  learnharness:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LH_PUBLIC_URL: https://${LH_HOST:?Set LH_HOST in deploy/.env (see .env.example)}
      LH_LEAN_URL: http://lean:3300
      LH_TLA_URL: http://tla:3400
      LH_CPP_URL: http://cpp:3500
    volumes:
      - learnharness-data:/data
    # Chromium (interactive demos) needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    networks: [default, lean, tla, cpp]

  # Lean 4 + Mathlib for code cells (deploy/lean). No internet access (the
  # "lean" network is internal), an unprivileged user, no capabilities and a
  # memory cap: cells can run arbitrary Lean code. Writes stay inside the
  # container and are gone after a restart.
  lean:
    image: learnharness-lean:${LEAN_TAG:-local}
    build: ./lean
    restart: unless-stopped
    environment:
      LH_PUBLIC_URL: https://${LH_HOST:?Set LH_HOST in deploy/.env (see .env.example)}
      # Language servers at once (each needs about 1.5 GB with Mathlib).
      LEAN_MAX_SESSIONS: ${LEAN_MAX_SESSIONS:-1}
    networks: [lean]
    tmpfs:
      - /tmp:size=256m
    mem_limit: ${LEAN_MEM_LIMIT:-3g}
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # The TLA+ tools for code cells (deploy/tla): SANY, TLC and the PlusCal
  # translator behind a small bridge. Same isolation as Lean: no internet
  # (the "tla" network is internal), an unprivileged user, no capabilities,
  # a read-only filesystem except /tmp, and a memory cap. Only the app talks
  # to it (Caddy does not route it).
  tla:
    image: learnharness-tla:${TLA_TAG:-local}
    build: ./tla
    restart: unless-stopped
    environment:
      # TLC's time budget per check (all runs: the model and the witnesses).
      TLA_CHECK_TIMEOUT_SECONDS: ${TLA_CHECK_TIMEOUT_SECONDS:-60}
      TLA_TLC_HEAP: ${TLA_TLC_HEAP:-640m}
    networks: [tla]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    mem_limit: ${TLA_MEM_LIMIT:-1g}
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # C++ for code cells (deploy/cpp): g++ with AddressSanitizer/UBSan behind
  # a small bridge. Learner code runs here, so: no internet (the "cpp"
  # network is internal), an unprivileged user, no capabilities, a read-only
  # filesystem except /tmp, and memory and process caps. Only the app talks
  # to it (Caddy does not route it).
  cpp:
    image: learnharness-cpp:${CPP_TAG:-local}
    build: ./cpp
    restart: unless-stopped
    environment:
      CPP_TEST_TIMEOUT_SECONDS: ${CPP_TEST_TIMEOUT_SECONDS:-5}
    networks: [cpp]
    read_only: true
    tmpfs:
      # exec: the compiled tests run from here.
      - /tmp:size=256m,exec
    mem_limit: ${CPP_MEM_LIMIT:-1g}
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - learnharness
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LH_HOST: ${LH_HOST:?Set LH_HOST in deploy/.env (see .env.example)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [default, lean]

networks:
  default:
  lean:
    internal: true
  tla:
    internal: true
  cpp:
    internal: true

volumes:
  learnharness-data:
  caddy-data:
  caddy-config:
